spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/paylens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
 
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
