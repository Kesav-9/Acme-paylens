services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paylens
      POSTGRES_USER: paylens
      POSTGRES_PASSWORD: paylens
    volumes: [paylens_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U paylens"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/paylens
      DB_USER: paylens
      DB_PASSWORD: paylens
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  paylens_db:
